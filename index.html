<!DOCTYPE html>
<!--
  DUSTRUNNER — CREW MANIFEST — CHANGELOG
  (Kept here so future edits can pick up context without re-deriving history.)

  v1 — Initial player-facing crew manifest tracker: tabs (All / per-character /
       Sell), Log New Item form, plain-text Share Summary with copy-to-clipboard,
       localStorage persistence.
  v2 — Added Qty field to the log form. Items can be logged as stacks; displayed
       value is unit value × quantity, name shows as "Item ×N" when N > 1.
  v3 — Added Transfer: a button on every item row opens a modal to move an item
       (or split part of a stack) to another character, the Sell pile, or a new
       Unavailable status (lost / destroyed / given away). Added the Unavailable
       tab.
  v4 — Added "Download as .txt" for the Share Summary. Added Export Data /
       Import Data (JSON) so the full manifest — not just the human-readable
       summary — can be handed off between players or devices without losing
       session-level detail.

  Pending / ideas not yet built:
  (none currently — add here as they come up)
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dustrunner — Crew Manifest</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg:       #111009;
  --surface:  #1c1a15;
  --surface2: #242018;
  --border:   #302c22;
  --tan:      #c8a97a;
  --tan-dim:  #7a6645;
  --text:     #d4cfc4;
  --dim:      #6b6455;
  --red:      #c0392b;
  --green:    #5d8a52;
  --mono:     'Share Tech Mono', monospace;
}

body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--mono);
  min-height:100vh;
  display:flex;
  justify-content:center;
  padding:20px 12px 40px;
}

/* ── Device frame ── */
.device{
  width:100%;
  max-width:680px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:8px;
  position:relative;
  overflow:hidden;
}

/* Corner marks */
.device::before,.device::after{
  content:'';
  position:absolute;
  width:14px; height:14px;
  border-color:var(--tan-dim);
  border-style:solid;
  z-index:2;
}
.device::before{ top:6px; left:6px; border-width:1px 0 0 1px; }
.device::after{  top:6px; right:6px; border-width:1px 1px 0 0; }
.device-foot::before,.device-foot::after{
  content:'';
  position:absolute;
  width:14px; height:14px;
  border-color:var(--tan-dim);
  border-style:solid;
}
.device-foot::before{ bottom:6px; left:6px; border-width:0 0 1px 1px; }
.device-foot::after{  bottom:6px; right:6px; border-width:0 1px 1px 0; }
.device-foot{ position:relative; }

/* ── Boot banner ── */
.banner{
  background:var(--bg);
  border-bottom:1px solid var(--border);
  padding:18px 20px 14px;
}
.brand-row{
  display:flex;
  align-items:baseline;
  gap:12px;
  margin-bottom:6px;
}
.brand-logo{
  font-size:22px;
  letter-spacing:.18em;
  color:var(--tan);
  font-weight:400;
}
.brand-sub{
  font-size:10px;
  color:var(--tan-dim);
  letter-spacing:.12em;
}
.brand-tagline{
  font-size:9px;
  color:var(--dim);
  letter-spacing:.06em;
  margin-bottom:10px;
}
.banner-meta{
  display:flex;
  gap:20px;
  border-top:1px solid var(--border);
  padding-top:10px;
  margin-top:4px;
}
.meta-item{ display:flex; flex-direction:column; gap:1px; }
.meta-label{ font-size:8px; color:var(--dim); letter-spacing:.1em; }
.meta-value{ font-size:11px; color:var(--text); }
.meta-value.tan{ color:var(--tan); }
.status-dot{
  display:inline-block;
  width:6px; height:6px;
  border-radius:50%;
  background:var(--green);
  margin-right:5px;
  vertical-align:middle;
}

/* ── Body ── */
.body{ padding:16px 18px; }

/* ── Tabs ── */
.tabs{
  display:flex;
  gap:2px;
  margin-bottom:14px;
  border-bottom:1px solid var(--border);
  padding-bottom:0;
}
.tab{
  background:none;
  border:none;
  font-family:var(--mono);
  font-size:11px;
  color:var(--dim);
  padding:6px 12px;
  cursor:pointer;
  border-bottom:2px solid transparent;
  margin-bottom:-1px;
  transition:color .12s, border-color .12s;
  letter-spacing:.04em;
}
.tab:hover{ color:var(--text); }
.tab.active{ color:var(--tan); border-bottom-color:var(--tan); }

/* ── Section header ── */
.section-hdr{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:8px;
  margin-top:16px;
}
.section-hdr:first-child{ margin-top:0; }
.section-title{ font-size:9px; color:var(--tan-dim); letter-spacing:.14em; }
.section-total{ font-size:11px; color:var(--tan); }

/* ── Item rows ── */
.item-row{
  display:grid;
  grid-template-columns:1fr auto auto;
  align-items:center;
  gap:8px;
  padding:6px 8px;
  border-bottom:1px solid var(--border);
  transition:background .1s;
}
.item-row:last-child{ border-bottom:none; }
.item-row:hover{ background:var(--surface2); }
.item-name{ font-size:11px; color:var(--text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.item-session{ font-size:9px; color:var(--dim); margin-top:1px; }
.item-val{ font-size:11px; color:var(--text); text-align:right; white-space:nowrap; }
.item-tag{
  font-size:9px; padding:1px 5px; border-radius:2px;
  border:1px solid var(--border); color:var(--dim);
  white-space:nowrap;
}
.item-tag.kept{ border-color:var(--green); color:var(--green); background:#0c1a0a; }
.item-tag.sell{ border-color:var(--tan-dim); color:var(--tan-dim); background:#1a1508; }
.item-tag.unavailable{ border-color:var(--red); color:var(--red); background:#1f0a08; }

.empty-msg{ text-align:center; padding:24px; font-size:10px; color:var(--dim); }

/* ── Row action buttons ── */
.act-btn{
  background:none;
  border:1px solid var(--border);
  color:var(--dim);
  font-family:var(--mono);
  font-size:9px;
  padding:2px 7px;
  border-radius:2px;
  cursor:pointer;
  white-space:nowrap;
  transition:border-color .12s, color .12s;
}
.act-btn:hover{ border-color:var(--tan-dim); color:var(--tan-dim); }
.del-btn{
  background:none; border:none; color:var(--dim);
  font-family:var(--mono); font-size:12px; cursor:pointer; padding:0 2px;
}
.del-btn:hover{ color:var(--red); }

/* ── Sell bucket ── */
.sell-bucket{
  background:var(--bg);
  border:1px solid var(--border);
  border-radius:4px;
  padding:10px 12px;
  margin-top:4px;
}
.sell-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:4px 0;
  border-bottom:1px solid var(--border);
  font-size:11px;
}
.sell-row:last-child{ border-bottom:none; }
.sell-name{ color:var(--text); flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; margin-right:8px; }
.sell-est{ color:var(--tan-dim); white-space:nowrap; }
.sell-foot{
  display:flex;
  justify-content:space-between;
  margin-top:8px;
  padding-top:8px;
  border-top:1px solid var(--border);
  font-size:10px;
}
.sell-foot-label{ color:var(--dim); }
.sell-foot-val{ color:var(--tan); }

/* ── Add form ── */
.add-section{
  background:var(--bg);
  border:1px solid var(--border);
  border-radius:4px;
  padding:12px;
  margin-top:14px;
}
.add-title{ font-size:9px; color:var(--dim); letter-spacing:.1em; margin-bottom:10px; }
.add-grid{ display:grid; grid-template-columns:1fr 70px 90px; gap:6px; margin-bottom:6px; }
.add-grid2{ display:grid; grid-template-columns:1fr 1fr 80px; gap:6px; margin-bottom:8px; }
.field-label{ font-size:8px; color:var(--dim); margin-bottom:2px; letter-spacing:.06em; }
.field-input{
  width:100%;
  background:var(--surface);
  border:1px solid var(--border);
  color:var(--text);
  font-family:var(--mono);
  font-size:11px;
  padding:4px 7px;
  border-radius:3px;
}
.field-input:focus{ outline:none; border-color:var(--tan-dim); }
.field-select{
  width:100%;
  background:var(--surface);
  border:1px solid var(--border);
  color:var(--text);
  font-family:var(--mono);
  font-size:11px;
  padding:4px 6px;
  border-radius:3px;
  cursor:pointer;
}
.add-btn-row{ display:flex; gap:6px; }
.btn{
  font-family:var(--mono);
  font-size:11px;
  padding:5px 14px;
  border-radius:3px;
  cursor:pointer;
  border:1px solid;
  transition:opacity .15s;
  letter-spacing:.04em;
}
.btn:hover{ opacity:.8; }
.btn-primary{ background:var(--tan); border-color:var(--tan); color:var(--bg); }
.btn-ghost{ background:none; border-color:var(--border); color:var(--dim); }
.btn-ghost:hover{ border-color:var(--tan-dim); color:var(--tan-dim); }
.btn-share{
  margin-left:auto;
  background:none;
  border:1px solid var(--tan-dim);
  color:var(--tan-dim);
  font-family:var(--mono);
  font-size:10px;
  padding:4px 12px;
  border-radius:3px;
  cursor:pointer;
  transition:all .15s;
}
.btn-share:hover{ border-color:var(--tan); color:var(--tan); }
.btn-util{
  background:none;
  border:1px solid var(--border);
  color:var(--dim);
  font-family:var(--mono);
  font-size:10px;
  padding:4px 10px;
  border-radius:3px;
  cursor:pointer;
  transition:all .15s;
}
.btn-util:hover{ border-color:var(--tan-dim); color:var(--tan-dim); }
.file-label{ display:inline-block; }

/* ── Share modal ── */
.modal-overlay{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.75);
  z-index:100;
  justify-content:center;
  align-items:center;
  padding:16px;
}
.modal-overlay.open{ display:flex; }
.modal{
  background:var(--surface);
  border:1px solid var(--tan-dim);
  border-radius:6px;
  width:100%;
  max-width:560px;
  padding:18px;
}
.modal-title{ font-size:11px; color:var(--tan); letter-spacing:.1em; margin-bottom:12px; }
.modal-text{
  background:var(--bg);
  border:1px solid var(--border);
  color:var(--text);
  font-family:var(--mono);
  font-size:10px;
  padding:10px;
  border-radius:3px;
  white-space:pre-wrap;
  line-height:1.6;
  max-height:400px;
  overflow-y:auto;
  margin-bottom:12px;
}
.modal-btns{ display:flex; gap:8px; justify-content:flex-end; }
</style>
</head>
<body>

<div class="device">
<div class="device-foot">

  <!-- ── Banner ── -->
  <div class="banner">
    <div class="brand-row">
      <span class="brand-logo">DUSTRUNNER</span>
      <span class="brand-sub">by Kassel &amp; Fenn Portable Systems</span>
    </div>
    <div class="brand-tagline">Built for the Reach. Built to last. — Model KF-7 Field Manifest Unit</div>
    <div class="banner-meta">
      <div class="meta-item">
        <span class="meta-label">Unit</span>
        <span class="meta-value tan" id="shipName">Seraphina</span>
      </div>
      <div class="meta-item">
        <span class="meta-label">Status</span>
        <span class="meta-value"><span class="status-dot"></span>Active</span>
      </div>
      <div class="meta-item">
        <span class="meta-label">Last Updated</span>
        <span class="meta-value" id="lastUpdated">—</span>
      </div>
      <div class="meta-item" style="margin-left:auto">
        <span class="meta-label">&nbsp;</span>
        <div style="display:flex;gap:6px;align-items:center">
          <button class="btn-util" onclick="exportData()" title="Download the full manifest as a data file">Export Data</button>
          <label class="btn-util file-label" title="Load a manifest data file exported earlier">
            Import Data
            <input type="file" accept=".json,application/json" onchange="importData(event)" style="display:none">
          </label>
          <button class="btn-share" onclick="openShare()">Share Summary</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ── Body ── -->
  <div class="body">

    <!-- Tabs -->
    <div class="tabs" id="tabs"></div>

    <!-- Content -->
    <div id="content"></div>

    <!-- Add form -->
    <div class="add-section">
      <div class="add-title">Log New Item</div>
      <div class="add-grid">
        <div>
          <div class="field-label">Description</div>
          <input class="field-input" id="fName" placeholder="Item name or description…" onkeydown="if(event.key==='Enter')addItem()">
        </div>
        <div>
          <div class="field-label">Qty</div>
          <input class="field-input" id="fQty" type="number" min="1" placeholder="1" onkeydown="if(event.key==='Enter')addItem()">
        </div>
        <div>
          <div class="field-label">Value (cr)</div>
          <input class="field-input" id="fValue" type="number" min="0" placeholder="0" onkeydown="if(event.key==='Enter')addItem()">
        </div>
      </div>
      <div class="add-grid2">
        <div>
          <div class="field-label">Recipient</div>
          <select class="field-select" id="fRecipient">
            <option value="Crew">Crew (shared)</option>
            <option value="Rast">Rast</option>
            <option value="Grevakh">Grevakh</option>
            <option value="Cael">Cael</option>
            <option value="Lyra">Lyra</option>
            <option value="Chungus">Chungus</option>
          </select>
        </div>
        <div>
          <div class="field-label">Session</div>
          <input class="field-input" id="fSession" placeholder="Session 1">
        </div>
        <div>
          <div class="field-label">Status</div>
          <select class="field-select" id="fStatus">
            <option value="kept">Kept</option>
            <option value="sell">To Sell</option>
          </select>
        </div>
      </div>
      <div class="add-btn-row">
        <button class="btn btn-primary" onclick="addItem()">Log Item</button>
        <button class="btn btn-ghost" onclick="clearAll()">Clear All</button>
      </div>
    </div>

  </div>
</div><!-- device-foot -->
</div><!-- device -->

<!-- Share modal -->
<div class="modal-overlay" id="modal" onclick="if(event.target===this)closeShare()">
  <div class="modal">
    <div class="modal-title">Crew Manifest — Share Summary</div>
    <div class="modal-text" id="shareText"></div>
    <div class="modal-btns">
      <button class="btn btn-ghost" onclick="downloadShareText()">Download .txt</button>
      <button class="btn btn-primary" onclick="copyShare()">Copy to Clipboard</button>
      <button class="btn btn-ghost" onclick="closeShare()">Close</button>
    </div>
  </div>
</div>

<!-- Transfer modal -->
<div class="modal-overlay" id="transferModal" onclick="if(event.target===this)closeTransfer()">
  <div class="modal">
    <div class="modal-title">Transfer Item</div>
    <div id="transferBody"></div>
    <div class="modal-btns">
      <button class="btn btn-primary" onclick="confirmTransfer()">Transfer</button>
      <button class="btn btn-ghost" onclick="closeTransfer()">Cancel</button>
    </div>
  </div>
</div>

<script>
// ── Data ────────────────────────────────────────────────────────────────────
const CHARS = ['Rast','Grevakh','Cael','Lyra','Chungus'];
const CHAR_COLORS = {
  Rast:'#c0392b', Grevakh:'#d4a017', Cael:'#1abc9c',
  Lyra:'#9b59b6', Chungus:'#e67e22', Crew:'#7a6645'
};

let STATE = {items:[], activeTab:'All'};
try{ const s=localStorage.getItem('cw_manifest'); if(s) STATE=JSON.parse(s); } catch{}
function save(){ localStorage.setItem('cw_manifest', JSON.stringify(STATE)); }

// ── Tabs ─────────────────────────────────────────────────────────────────────
function renderTabs(){
  const tabs = document.getElementById('tabs');
  const options = ['All', ...CHARS, 'Sell', 'Unavailable'];
  tabs.innerHTML = '';
  options.forEach(t => {
    const btn = document.createElement('button');
    btn.className = 'tab' + (STATE.activeTab===t?' active':'');
    btn.textContent = t;
    btn.onclick = () => { STATE.activeTab=t; save(); refresh(); };
    tabs.appendChild(btn);
  });
}

// ── Items for tab ─────────────────────────────────────────────────────────────
function itemsForTab(tab){
  if(tab==='All') return STATE.items.filter(i=>i.status==='kept');
  if(tab==='Sell') return STATE.items.filter(i=>i.status==='sell');
  if(tab==='Unavailable') return STATE.items.filter(i=>i.status==='unavailable');
  return STATE.items.filter(i=>i.status==='kept' && (i.recipient===tab || i.recipient==='Crew'));
}

// ── Format ────────────────────────────────────────────────────────────────────
function fmt(n){ return Math.round(n).toLocaleString('en-US')+' cr'; }

// ── Quantity helpers ──────────────────────────────────────────────────────────
function itemQty(item){ return item.qty && item.qty > 1 ? item.qty : 1; }
function itemTotal(item){ return item.value * itemQty(item); }
function displayName(item){
  const q = itemQty(item);
  return q > 1 ? `${item.name} ×${q}` : item.name;
}

// ── Render content ────────────────────────────────────────────────────────────
function renderContent(){
  const tab = STATE.activeTab;
  const el  = document.getElementById('content');

  if(tab==='Sell'){
    renderSell(el); return;
  }
  if(tab==='Unavailable'){
    renderUnavailable(el); return;
  }

  const items = itemsForTab(tab);

  // Group by session
  const groups = {};
  items.forEach(i => {
    if(!groups[i.session]) groups[i.session]=[];
    groups[i.session].push(i);
  });

  const total = items.reduce((s,i) => s + itemTotal(i), 0);

  let html = `<div class="section-hdr">
    <span class="section-title">${tab==='All'?'All Acquired Items':tab+' — Assigned Items'}</span>
    <span class="section-total">${fmt(total)}</span>
  </div>`;

  if(items.length===0){
    html += '<div class="empty-msg">Nothing logged yet for this crew member.</div>';
    el.innerHTML=html; return;
  }

  Object.entries(groups).forEach(([session, sitems]) => {
    html += `<div style="margin-bottom:2px;padding:4px 8px;background:var(--surface2);font-size:9px;color:var(--dim);letter-spacing:.1em">${session}</div>`;
    sitems.forEach(item => {
      html += `<div class="item-row">
        <div>
          <div class="item-name">${esc(displayName(item))}</div>
          <div class="item-session">${esc(item.recipient)}</div>
        </div>
        <div style="text-align:right">
          <div class="item-val">${fmt(itemTotal(item))}</div>
        </div>
        <div style="display:flex;align-items:center;gap:6px">
          <span class="item-tag kept">Kept</span>
          <button class="act-btn" onclick="openTransfer(${item.id})">Transfer</button>
          <button class="del-btn" onclick="deleteItem(${item.id})" title="Remove">&times;</button>
        </div>
      </div>`;
    });
  });

  el.innerHTML = html;
}

function renderSell(el){
  const items = STATE.items.filter(i=>i.status==='sell');
  const rawTotal = items.reduce((s,i)=>s+itemTotal(i),0);
  const estTotal = rawTotal*0.1;

  let html = `<div class="section-hdr">
    <span class="section-title">Items to Sell</span>
    <span class="section-total">${fmt(estTotal)} est.</span>
  </div>`;

  if(items.length===0){
    html += '<div class="empty-msg">No items marked for sale.</div>';
    el.innerHTML=html; return;
  }

  html += '<div class="sell-bucket">';
  items.forEach(item => {
    html += `<div class="sell-row">
      <span class="sell-name">${esc(displayName(item))}</span>
      <span style="color:var(--dim);font-size:9px;margin-right:8px">${esc(item.session)}</span>
      <span class="sell-est">${fmt(itemTotal(item)*0.1)}</span>
      <button class="act-btn" style="margin-left:8px" onclick="openTransfer(${item.id})">Transfer</button>
      <button class="del-btn" style="margin-left:4px" onclick="deleteItem(${item.id})">&times;</button>
    </div>`;
  });
  html += `<div class="sell-foot">
    <span class="sell-foot-label">Face value: ${fmt(rawTotal)} &nbsp;|&nbsp; Sell estimate (10%):</span>
    <span class="sell-foot-val">${fmt(estTotal)}</span>
  </div></div>`;

  el.innerHTML = html;
}

function renderUnavailable(el){
  const items = STATE.items.filter(i=>i.status==='unavailable');
  const rawTotal = items.reduce((s,i)=>s+itemTotal(i),0);

  let html = `<div class="section-hdr">
    <span class="section-title">Unavailable (Lost / Destroyed / Given Away)</span>
    <span class="section-total">${fmt(rawTotal)} face value</span>
  </div>`;

  if(items.length===0){
    html += '<div class="empty-msg">Nothing here. Everything the crew has found is accounted for.</div>';
    el.innerHTML=html; return;
  }

  html += '<div class="sell-bucket">';
  items.forEach(item => {
    html += `<div class="sell-row">
      <span class="sell-name">${esc(displayName(item))}</span>
      <span style="color:var(--dim);font-size:9px;margin-right:8px">${esc(item.session)}</span>
      <span class="item-tag unavailable">Unavailable</span>
      <button class="act-btn" style="margin-left:8px" onclick="openTransfer(${item.id})">Transfer</button>
      <button class="del-btn" style="margin-left:4px" onclick="deleteItem(${item.id})">&times;</button>
    </div>`;
  });
  html += '</div>';

  el.innerHTML = html;
}

// ── Add item ──────────────────────────────────────────────────────────────────
function addItem(){
  const name      = document.getElementById('fName').value.trim();
  const qtyRaw    = document.getElementById('fQty').value;
  const qty       = qtyRaw.trim() === '' ? 1 : Math.max(1, parseInt(qtyRaw) || 1);
  const value     = parseFloat(document.getElementById('fValue').value)||0;
  const recipient = document.getElementById('fRecipient').value;
  const session   = document.getElementById('fSession').value.trim()||'Session 1';
  const status    = document.getElementById('fStatus').value;
  if(!name){ document.getElementById('fName').focus(); return; }
  STATE.items.push({id:Date.now()+Math.random(), name, qty, value, recipient, session, status});
  save();
  document.getElementById('fName').value='';
  document.getElementById('fQty').value='';
  document.getElementById('fValue').value='';
  updateTimestamp();
  refresh();
  document.getElementById('fName').focus();
}

// ── Delete ────────────────────────────────────────────────────────────────────
function deleteItem(id){
  STATE.items=STATE.items.filter(i=>i.id!==id);
  save(); refresh();
}

// ── Transfer ──────────────────────────────────────────────────────────────────
let transferItemId = null;

function statusLabel(item){
  if(item.status==='sell') return 'Sell Pile';
  if(item.status==='unavailable') return 'Unavailable';
  return item.recipient;
}

function openTransfer(id){
  const item = STATE.items.find(i=>i.id===id);
  if(!item) return;
  transferItemId = id;
  const qty = itemQty(item);
  const body = document.getElementById('transferBody');
  const destOptions = ['Crew', ...CHARS]
    .filter(c => !(item.status==='kept' && item.recipient===c))
    .map(c => `<option value="${c}">${c==='Crew'?'Crew (shared)':c}</option>`).join('');
  body.innerHTML = `
    <div style="margin-bottom:12px;font-size:11px;color:var(--text)">
      ${esc(displayName(item))} — currently with <span style="color:var(--tan)">${esc(statusLabel(item))}</span>
    </div>
    <div class="add-grid2" style="grid-template-columns:70px 1fr">
      <div>
        <div class="field-label">Qty to move</div>
        <input class="field-input" id="tQty" type="number" min="1" max="${qty}" value="${qty}">
      </div>
      <div>
        <div class="field-label">Send to</div>
        <select class="field-select" id="tDest">
          ${destOptions}
          <option value="__sell"${item.status==='sell'?' disabled':''}>Sell Pile</option>
          <option value="__unavailable"${item.status==='unavailable'?' disabled':''}>Destroy / Give Away / Lost</option>
        </select>
      </div>
    </div>
    <div style="font-size:9px;color:var(--dim);margin-top:8px">Moving fewer than the full stack splits it — the rest stays where it is.</div>
  `;
  document.getElementById('transferModal').classList.add('open');
}

function closeTransfer(){
  document.getElementById('transferModal').classList.remove('open');
  transferItemId = null;
}

function confirmTransfer(){
  const item = STATE.items.find(i=>i.id===transferItemId);
  if(!item) return closeTransfer();

  const maxQty = itemQty(item);
  let moveQty = parseInt(document.getElementById('tQty').value) || 1;
  moveQty = Math.max(1, Math.min(maxQty, moveQty));
  const dest = document.getElementById('tDest').value;

  let newStatus = 'kept', newRecipient = item.recipient;
  if(dest === '__sell'){ newStatus = 'sell'; }
  else if(dest === '__unavailable'){ newStatus = 'unavailable'; }
  else { newStatus = 'kept'; newRecipient = dest; }

  if(moveQty >= maxQty){
    // Move the whole stack in place — no split needed
    item.status = newStatus;
    item.recipient = newRecipient;
    if(!item.qty) item.qty = 1;
  } else {
    // Split: shrink the original stack, create a new item for the moved portion
    item.qty = maxQty - moveQty;
    STATE.items.push({
      id: Date.now() + Math.random(),
      name: item.name,
      qty: moveQty,
      value: item.value,
      recipient: newRecipient,
      session: item.session,
      status: newStatus,
    });
  }

  save();
  updateTimestamp();
  closeTransfer();
  refresh();
}

// ── Clear ─────────────────────────────────────────────────────────────────────
function clearAll(){
  if(!confirm('Clear all logged items?')) return;
  STATE.items=[]; save(); refresh();
}

// ── Share ─────────────────────────────────────────────────────────────────────
function openShare(){
  const lines = [];
  const now = new Date().toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
  lines.push('DUSTRUNNER — CREW MANIFEST');
  lines.push('Seraphina  //  '+now);
  lines.push('');

  // Per character
  CHARS.forEach(c => {
    const mine = STATE.items.filter(i=>i.status==='kept'&&(i.recipient===c||i.recipient==='Crew'));
    if(mine.length===0) return;
    const total = mine.reduce((s,i)=>s+itemTotal(i),0);
    lines.push('── '+c+' ──────────────────');
    mine.forEach(i => lines.push('  '+displayName(i).padEnd(32,' ')+fmt(itemTotal(i))));
    lines.push('  Total: '+fmt(total));
    lines.push('');
  });

  // Crew shared
  const shared = STATE.items.filter(i=>i.status==='kept'&&i.recipient==='Crew');
  if(shared.length>0){
    lines.push('── Crew (Shared) ──────────────');
    shared.forEach(i=>lines.push('  '+displayName(i).padEnd(32,' ')+fmt(itemTotal(i))));
    lines.push('');
  }

  // Sell bucket
  const sell = STATE.items.filter(i=>i.status==='sell');
  if(sell.length>0){
    lines.push('── To Sell ────────────────────');
    sell.forEach(i=>lines.push('  '+displayName(i).padEnd(32,' ')+'~'+fmt(itemTotal(i)*0.1)));
    const est=sell.reduce((s,i)=>s+itemTotal(i)*0.1,0);
    lines.push('  Estimated proceeds: '+fmt(est));
    lines.push('');
  }

  // Grand total kept
  const allKept=STATE.items.filter(i=>i.status==='kept').reduce((s,i)=>s+itemTotal(i),0);
  lines.push('══════════════════════════════════');
  lines.push('Total kept value: '+fmt(allKept));

  lastShareText = lines.join('\n');
  document.getElementById('shareText').textContent=lastShareText;
  document.getElementById('modal').classList.add('open');
}

let lastShareText = '';

function closeShare(){ document.getElementById('modal').classList.remove('open'); }

function copyShare(){
  const text = document.getElementById('shareText').textContent;
  navigator.clipboard.writeText(text).then(()=>{
    const btn = document.querySelector('#modal .modal-btns .btn-primary');
    const orig = btn.textContent;
    btn.textContent='Copied!';
    setTimeout(()=>btn.textContent=orig, 1500);
  });
}

function downloadFile(filename, contents, mime){
  const blob = new Blob([contents], {type: mime});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function dateStamp(){
  const d = new Date();
  return d.toISOString().slice(0,10);
}

function downloadShareText(){
  downloadFile(`dustrunner-manifest-${dateStamp()}.txt`, lastShareText, 'text/plain');
  const btn = document.querySelector('#modal .modal-btns .btn-ghost');
  if(btn){
    const orig = btn.textContent;
    btn.textContent='Downloaded!';
    setTimeout(()=>btn.textContent=orig, 1500);
  }
}

// ── Export / Import full data ────────────────────────────────────────────────
function exportData(){
  const payload = {
    exportedFrom: 'Dustrunner Crew Manifest',
    exportedAt: new Date().toISOString(),
    state: STATE,
  };
  downloadFile(`dustrunner-manifest-data-${dateStamp()}.json`, JSON.stringify(payload, null, 2), 'application/json');
}

function importData(event){
  const file = event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const parsed = JSON.parse(reader.result);
      const incoming = parsed && parsed.state ? parsed.state : parsed;
      if(!incoming || !Array.isArray(incoming.items)){
        alert('That file doesn\'t look like a Dustrunner manifest export.');
        return;
      }
      if(!confirm(`Import this manifest? It contains ${incoming.items.length} item(s) and will replace what's currently loaded on this device.`)) return;
      STATE = incoming;
      save();
      updateTimestamp();
      refresh();
    } catch(err){
      alert('Could not read that file — make sure it\'s an unmodified manifest export.');
    }
    event.target.value = '';
  };
  reader.readAsText(file);
}

// ── Timestamp ─────────────────────────────────────────────────────────────────
function updateTimestamp(){
  document.getElementById('lastUpdated').textContent =
    new Date().toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
}

// ── Escape ────────────────────────────────────────────────────────────────────
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// ── Refresh ───────────────────────────────────────────────────────────────────
function refresh(){
  renderTabs();
  renderContent();
}

// ── Init ──────────────────────────────────────────────────────────────────────
document.getElementById('fSession').value='Session 1';
updateTimestamp();
refresh();
</script>
